[package]
name = "moxy"
version = "0.2.0"
edition = "2024"
description = "Moxy: a local gateway server for AI model endpoints"
license = "MIT OR Apache-2.0"

[dependencies]
pingora = { version = "0.9", features = ["proxy", "rustls"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
arc-swap = "1"
notify = "8"
openidconnect = { version = "4", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
rust-embed = { version = "8", features = ["mime-guess"] }
bytes = "1"
http = "1"
log = "0.4"
env_logger = "0.11"
percent-encoding = "2"
url = "2"
futures-util = "0.3"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
