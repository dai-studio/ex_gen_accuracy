[package]
name = "moxy"
version = "0.1.0"
edition = "2024"
description = "Moxy: a local gateway for AI model endpoints, built on Pingora"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "moxy"
path = "src/main.rs"

[dependencies]
pingora = { version = "0.9.0", features = ["proxy", "rustls"] }
redb = "4.4.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
http = "1"
bytes = "1"
anyhow = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
notify = "8"
arc-swap = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
